spring:
  # ─── Mail (SMTP) ────────────────────────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:noreply@jwtauth.local}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jwtauthdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ─── Redis (production cache backend) ───────────────────────────────────────
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}

  # ─── OAuth2 Social Login (Google) — set real values via env vars in production ──
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-client-secret}
            scope: openid,email,profile
        provider:
          google:
            issuer-uri: https://accounts.google.com

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION_MS:900000}                    # 15 minutes (access token)
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days    (refresh token)
  blacklist:
    cleanup-interval-ms: ${JWT_BLACKLIST_CLEANUP_MS:3600000} # 1 hour    (purge expired JTIs)

# ─── Application settings ─────────────────────────────────────────────────────
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/callback}
  rate-limit:
    capacity: ${RATE_LIMIT_CAPACITY:20}          # max burst per IP
    refill-per-minute: ${RATE_LIMIT_REFILL:10}   # tokens added per minute
  cache:
    type: ${CACHE_TYPE:caffeine}                 # caffeine (default) or redis
  erasure:
    cron: ${ERASURE_CRON:0 0 0 * * *}           # default: run at midnight every day

# ─── Brute-force protection ────────────────────────────────────────────────────
security:
  max-failed-attempts: ${MAX_FAILED_ATTEMPTS:5}                      # auto-lock after N failures
  lockout-duration-minutes: ${LOCKOUT_DURATION_MINUTES:30}           # failure window in minutes
  attempt-cleanup-interval-ms: ${ATTEMPT_CLEANUP_MS:3600000}         # purge old rows every 1 hour

# ─── Spring Boot Actuator ─────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        # Expose: health, info, metrics, env, beans, mappings, loggers, httptrace
        include: health,info,metrics,env,beans,mappings,loggers
      base-path: /actuator
  endpoint:
    health:
      # Show full component breakdown (db, diskSpace, etc.) — restrict to ADMIN in prod
      show-details: always
      show-components: always
    info:
      enabled: true
  info:
    env:
      enabled: true
    build:
      enabled: true

# Application info shown at GET /actuator/info
info:
  app:
    name: JWT Authentication API
    description: Stateless JWT auth with dynamic role-based access control
    version: 1.0.0
    java-version: "@java.version@"

# ─── SpringDoc / Swagger UI ───────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs           # OpenAPI JSON spec:  GET /api-docs
  swagger-ui:
    path: /swagger-ui.html    # Swagger UI:         GET /swagger-ui.html
    operationsSorter: method  # Sort by HTTP method (GET before POST etc.)
    tagsSorter: alpha          # Sort tags alphabetically
    try-it-out-enabled: true  # Enable "Try it out" by default
    persist-authorization: true  # JWT token survives page refresh
  show-actuator: false        # Don't include actuator endpoints in Swagger
