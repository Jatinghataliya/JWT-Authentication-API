spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  mail:
    host: localhost
    port: 25
    username: test
    password: test

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 900000
  refresh-expiration: 604800000

app:
  base-url: http://localhost:8080

security:
  max-failed-attempts: 3       # low threshold for fast tests
  lockout-duration-minutes: 30
  attempt-cleanup-interval-ms: 3600000

management:
  health:
    mail:
      enabled: false           # disable mail health check — no real SMTP in tests
